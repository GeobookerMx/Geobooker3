# Netlify Configuration
# Optimizaciones para rendimiento global y CDN

[build]
  publish = "dist"
  command = "npm run build"

# ==========================================
# CDN EDGE - Configuración Global Performance
# ==========================================

# Headers para assets estáticos (imágenes, fonts, etc)
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/biblioteca/*.pdf"
  [headers.values]
    Content-Type = "application/pdf"
    X-Robots-Tag = "index, follow"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/biblioteca/pdfs/*.pdf"
  [headers.values]
    Content-Type = "application/pdf"
    X-Robots-Tag = "index, follow"
    Cache-Control = "public, max-age=86400"
    
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    
[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Headers para JavaScript y CSS
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Headers para HTML (no cachear para tener updates inmediatos)
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    
# Headers para index.html
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# ==========================================
# SEO endpoints host-aware (.com global / .com.mx Mexico)
[[redirects]]
  from = "/robots.txt"
  to = "/.netlify/functions/robots-generator"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap-generator"
  status = 200
  force = true

[[redirects]]
  from = "/llms.txt"
  to = "/.netlify/functions/llms-generator"
  status = 200
  force = true

[[redirects]]
  from = "/biblioteca/biblioteca-geobooker-2026-compilado-para-word-v3.txt"
  to = "/biblioteca/biblioteca-geobooker-2026-edicion-profesional.pdf"
  status = 301
  force = true

[[redirects]]
  from = "/biblioteca/biblioteca-geobooker-2026-compilado-para-word-v3.md"
  to = "/biblioteca/biblioteca-geobooker-2026-edicion-profesional.pdf"
  status = 301
  force = true

# SPA: Redirigir todas las rutas al index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ==========================================
# Build Processing (Optimizaciones)
# ==========================================

[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true

# ==========================================
# Dev Settings
# ==========================================

[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 5173
  framework = "vite"

# ==========================================
# Scheduled Functions (Cron Jobs)
# ==========================================

# Cron Job: Check Outdated Businesses (Diario 9am CST)
[functions."check-outdated-businesses"]
  schedule = "0 15 * * *"  # 15:00 UTC = 9:00 AM CST (UTC-6)

# Nota: El cron ejecuta la función en netlify/functions/check-outdated-businesses.js
# que verifica negocios desactualizados y envía emails automáticamente


# Edge Functions
[[edge_functions]]
  function = "seo-business"
  path = "/business/*"

