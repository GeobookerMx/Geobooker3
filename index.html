  <!-- 
    FIX iOS WKWebView: Carga Google Maps con callback explícito.
    'loading=async' falla silenciosamente en WKWebView de iOS Capacitor.
    Usamos el parámetro 'callback=__gmInit' para detectar cuando Maps está listo.
  -->
  <script>
    // Callback global que Google Maps llama cuando termina de cargar
    window.__gmInit = function() {
      window.__gmReady = true;
      // Disparar evento custom para que BusinessMap.jsx se entere
      document.dispatchEvent(new Event('google-maps-ready'));
    };

    // Handler de error de autenticación (API key inválida o sin billing)
    window.gm_authFailure = function() {
      console.error('[Geobooker] Google Maps auth failure. Verifica la API Key y billing en Google Cloud.');
      document.dispatchEvent(new Event('google-maps-auth-error'));
    };

    (function() {
      // Evitar cargar dos veces
      if (document.getElementById('google-maps-script')) return;
      
      var key = document.querySelector('meta[name="google-maps-key"]')?.content
                || 'AIzaSyB0sOzA3Hzj8zX7Rn9M0eGJM4pEeBdTff4';

      var script = document.createElement('script');
      script.id = 'google-maps-script';
      // ✅ callback=__gmInit garantiza que iOS WKWebView detecte la carga correctamente.
      // ✅ loading=async evita la advertencia de rendimiento de Google Maps JS API.
      script.src = 'https://maps.googleapis.com/maps/api/js?key=' + key
                   + '&libraries=places&loading=async&callback=__gmInit';
      script.async = true;
      script.defer = true;
      script.onerror = function() {
        console.error('[Geobooker] Error de red cargando Google Maps API');
        document.dispatchEvent(new Event('google-maps-network-error'));
      };
      document.head.appendChild(script);
    })();
  </script>

<body>
  <!-- Fallback visual durante carga -->
  <div class="loading-fallback">
    <div style="text-align: center;">
      <div
        style="width: 40px; height: 40px; border: 3px solid #f3f4f6; border-top: 3px solid #5558c4; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 1rem;">
      </div>
      <p id="loading-text" style="color: #64748b; font-size: 0.9rem;">Loading Geobooker...</p>
      <script>
        (function () {
          var isEnglish = window.location.hostname.endsWith('geobooker.com') && !window.location.hostname.includes('.mx');
          document.getElementById('loading-text').textContent = isEnglish ? 'Loading Geobooker...' : 'Cargando Geobooker...';
        })();
      </script>
    </div>
  </div>

  <div id="root"></div>

  <!-- SCRIPT DE CONTROL DE FUENTES Y CARGA -->
  <script>
    // Función para detectar carga de fuentes
    function checkFontsLoaded() {
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(function () {
          document.documentElement.classList.add('fonts-loaded');
          // Ocultar loading fallback
          const fallback = document.querySelector('.loading-fallback');
          if (fallback) {
            setTimeout(() => {
              fallback.style.opacity = '0';
              setTimeout(() => {
                fallback.style.display = 'none';
              }, 300);
            }, 500);
          }
        });
      } else {
        // Fallback para navegadores antiguos
        setTimeout(function () {
          document.documentElement.classList.add('fonts-loaded');
          const fallback = document.querySelector('.loading-fallback');
          if (fallback) {
            fallback.style.opacity = '0';
            setTimeout(() => {
              fallback.style.display = 'none';
            }, 300);
          }
        }, 1500);
      }

      // Timeout de seguridad
      setTimeout(function () {
        document.documentElement.classList.add('fonts-loaded');
        const fallback = document.querySelector('.loading-fallback');
        if (fallback) {
          fallback.style.opacity = '0';
          setTimeout(() => {
            fallback.style.display = 'none';
          }, 300);
        }
      }, 4000);
    }

    // Inicializar cuando el DOM esté listo
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', checkFontsLoaded);
    } else {
      checkFontsLoaded();
    }

    // Register Service Worker for PWA — ONLY in production
    if ('serviceWorker' in navigator) {
      const isDev = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      
      if (isDev) {
        // DEV MODE: Unregister any existing Service Worker to avoid caching issues
        navigator.serviceWorker.getRegistrations().then(registrations => {
          registrations.forEach(reg => {
            reg.unregister();
            console.log('[DEV] Service Worker unregistered to avoid cache issues');
          });
        });
        // Also clear all caches
        if (window.caches) {
          caches.keys().then(names => {
            names.forEach(name => caches.delete(name));
            if (names.length > 0) console.log('[DEV] Cleared', names.length, 'caches');
          });
        }
      } else {
        // PRODUCTION: Register Service Worker normally
        const hadServiceWorkerController = Boolean(navigator.serviceWorker.controller);
        let reloadingForServiceWorkerUpdate = false;

        if (hadServiceWorkerController) {
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (reloadingForServiceWorkerUpdate) return;
            reloadingForServiceWorkerUpdate = true;
            window.location.reload();
          });
        }

        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              console.debug('SW registered:', registration.scope);
              if (registration.waiting) {
                registration.waiting.postMessage({ type: 'SKIP_WAITING' });
              }
              registration.update().catch(error => {
                console.warn('SW update check failed:', error);
              });
            })
            .catch(error => {
              console.error('SW registration failed:', error);
            });
        });
      }
    }

    // Animación de spin para el loading
    const style = document.createElement('style');
    style.textContent = `
        @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
      `;
    document.head.appendChild(style);

    // Bootstrap recovery: covers a failed entry bundle before main.jsx can
    // register Vite's preload error handler. One automatic reload is allowed;
    // a second failure remains visible and offers a manual retry.
    (function installBootstrapRecovery() {
      const BOOTSTRAP_RECOVERY_KEY = 'geobooker_bootstrap_recovery_attempted';
      const BOOT_TIMEOUT_MS = 15000;

      window.__GEOBOOKER_BOOTSTRAPPED__ = false;

      const showBootstrapFailure = () => {
        const fallback = document.querySelector('.loading-fallback');
        const loadingText = document.getElementById('loading-text');
        if (!fallback || !loadingText) return;

        fallback.style.display = 'flex';
        fallback.style.opacity = '1';
        loadingText.textContent = document.documentElement.lang === 'en'
          ? 'Geobooker could not start. Please try again.'
          : 'Geobooker no pudo iniciar. Intenta nuevamente.';

        if (!document.getElementById('bootstrap-retry-button')) {
          const retryButton = document.createElement('button');
          retryButton.id = 'bootstrap-retry-button';
          retryButton.type = 'button';
          retryButton.textContent = document.documentElement.lang === 'en' ? 'Retry' : 'Reintentar';
          retryButton.style.cssText = 'margin-top:16px;padding:10px 20px;border:0;border-radius:8px;background:#5558c4;color:white;font-weight:600;cursor:pointer;';
          retryButton.addEventListener('click', () => window.location.reload());
          loadingText.parentElement.appendChild(retryButton);
        }
      };

      const recoverBootstrap = () => {
        if (window.__GEOBOOKER_BOOTSTRAPPED__) return;

        try {
          if (sessionStorage.getItem(BOOTSTRAP_RECOVERY_KEY) === '1') {
            showBootstrapFailure();
            return;
          }
          sessionStorage.setItem(BOOTSTRAP_RECOVERY_KEY, '1');
          window.location.reload();
        } catch (error) {
          console.warn('[Geobooker] Bootstrap recovery guard unavailable:', error);
          showBootstrapFailure();
        }
      };

      const bootTimer = window.setTimeout(recoverBootstrap, BOOT_TIMEOUT_MS);
      window.addEventListener('geobooker:boot-success', () => window.clearTimeout(bootTimer), { once: true });
      window.addEventListener('error', (event) => {
        if (event.target?.id === 'geobooker-entry') recoverBootstrap();
      }, true);
    })();
  </script>

  <script id="geobooker-entry" type="module" src="/src/main.jsx"></script>
