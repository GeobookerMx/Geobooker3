name: Monthly Security Review

on:
  workflow_dispatch:
  schedule:
    # Before day 5 each month. 12:00 UTC ~= morning Mexico time.
    - cron: '0 12 4 * *'

permissions:
  contents: read

jobs:
  security-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare tracked file list
        run: git ls-files > .security-tracked-files.txt

      - name: Secret scan tracked files
        run: node scripts/security/secret-scan.mjs .security-tracked-files.txt

      - name: Dependency audit
        run: npm audit --audit-level=moderate

      - name: Production build validation
        run: npm run build
